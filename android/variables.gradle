ext {
    minSdkVersion = 23
    compileSdkVersion = 35
    targetSdkVersion = 35
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'

    // @capacitor-firebase/authentication defaults this to false, which declares
    // the Google Sign-In libraries `compileOnly` — they compile fine and are
    // then missing at runtime, so signInWithGoogle dies with NoClassDefFoundError
    // on the device rather than failing the build. Must be true for the Google
    // provider to actually work.
    rgcfaIncludeGoogle = true

    // Same trap, second provider. Left false until the Facebook app exists:
    // the login SDK pulls in a manifest that *requires* facebook_app_id and
    // facebook_client_token string resources, so turning this on before those
    // are set makes the app crash at launch rather than merely lack a button.
    // Flip to true at the same time as android/app/src/main/res/values/
    // facebook.xml gets real values — see docs/facebook-login.md.
    rgcfaIncludeFacebook = false
    facebookLoginVersion = '18.0.0'

    firebaseAuthVersion = '23.1.0'
    playServicesAuthVersion = '21.2.0'
    androidxCredentialsVersion = '1.3.0'
    androidxCredentialsPlayServicesAuthVersion = '1.3.0'
    librariesIdentityGoogleidVersion = '1.1.1'
}