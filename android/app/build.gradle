apply plugin: 'com.android.application'

// Signing credentials come from android/keystore.properties (gitignored, local
// builds) or from environment variables (CI). Never hardcoded — this repo is
// public. If neither source is present the release build stays unsigned rather
// than failing, so `assembleDebug` and IDE syncs keep working on a clean clone.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def signingStoreFile = keystoreProperties['storeFile'] ?: System.getenv('ANDROID_KEYSTORE_PATH')
def signingStorePassword = keystoreProperties['storePassword'] ?: System.getenv('ANDROID_KEYSTORE_PASSWORD')
def signingKeyAlias = keystoreProperties['keyAlias'] ?: System.getenv('ANDROID_KEY_ALIAS')
def signingKeyPassword = keystoreProperties['keyPassword'] ?: System.getenv('ANDROID_KEY_PASSWORD')
// Resolved against android/ (not android/app/) so a relative path in
// keystore.properties means what it looks like it means. Absolute paths — the
// recommended form, keystore lives outside the repo — pass through unchanged.
def signingStoreResolved = signingStoreFile == null ? null : rootProject.file(signingStoreFile)
def hasSigningConfig = signingStoreResolved != null && signingStoreResolved.exists()

android {
    namespace "com.ruqyah.pro"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.ruqyah.pro"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Bump BOTH by hand for every upload that reaches Play — including
        // internal-testing builds you end up discarding. Play permanently
        // rejects a versionCode it has already seen. Deliberately not derived
        // from the CI run number, so a local build and a CI build of the same
        // commit produce the same artifact.
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasSigningConfig) {
            release {
                storeFile signingStoreResolved
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
                // Play requires v2 at minimum; v1 keeps API 23 devices happy.
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        debug {
            // Google Sign-In checks the app's signing certificate against the
            // SHA-1 fingerprints registered on the Firebase project. A CI runner
            // generates a throwaway debug keystore per job, so a debug APK would
            // present a different fingerprint every build and Play Services would
            // reject it with a bare DEVELOPER_ERROR. Signing test builds with the
            // upload key instead gives one stable fingerprint to register.
            // Without the keystore this falls back to the normal debug key and
            // everything except Google sign-in still works.
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
        release {
            // Stays false on purpose. proguard-rules.pro is the stock empty
            // file with no Capacitor keep rules, and Capacitor resolves plugins
            // by reflection over @CapacitorPlugin annotations — R8 would strip
            // them and the app would throw PluginNotFound at runtime, in a way
            // debug builds never reproduce. The APK is ~6 MB; there is nothing
            // worth shrinking.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// Loud at configuration time rather than a silently unsigned AAB that Play
// rejects twenty minutes later at upload.
gradle.taskGraph.whenReady { graph ->
    if (!hasSigningConfig && graph.allTasks.any { it.name.toLowerCase().contains('release') }) {
        logger.warn("WARNING: no signing config found (android/keystore.properties or " +
                    "ANDROID_KEYSTORE_* env vars). The release artifact will be UNSIGNED " +
                    "and Play will refuse it. See docs/release.md.")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
