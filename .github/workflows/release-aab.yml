name: Release AAB

# Builds the signed Android App Bundle that gets uploaded to Play Console.
#
# Triggered by pushing a version tag:
#     git tag v1.0.0 && git push origin v1.0.0
# or manually from the Actions tab.
#
# THIS WORKFLOW HANDLES THE UPLOAD KEY. The repository is public, so:
#   - the keystore only ever exists as a GitHub secret and as a file inside the
#     runner's workspace, which is destroyed when the job ends;
#   - nothing keystore-related is ever echoed (base64 of a .jks is the key);
#   - the AAB artifact is signed but contains no secret material.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      # Fail immediately with a readable message rather than producing an
      # unsigned bundle that Play rejects at upload time.
      - name: Verify signing secrets are present
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_B64" ]   || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]      || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]   || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing"
            echo "See docs/release.md for how to create them."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Must match capacitor.build.gradle, which targets VERSION_21.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Assets (native target)
        run: npm run build:native

      # Fail before the 10-minute Gradle build rather than after it.
      - name: Policy audit (native/)
        run: npm run audit:native

      # Cheap insurance against the 390 MB regression: build.js already caps
      # native/ at 20 MB, this re-checks the directory that actually ships.
      - name: Guard bundle size
        run: |
          SIZE_KB=$(du -sk native | cut -f1)
          echo "native/ is ${SIZE_KB} KB"
          if [ "$SIZE_KB" -gt 20480 ]; then
            echo "native/ exceeded 20 MB — refusing to build a release."
            exit 1
          fi

      # Required for Google sign-in. Unlike the debug workflow this is a hard
      # failure: a release that silently cannot sign in with Google is worse
      # than no release.
      - name: Restore google-services.json
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GS_JSON" ]; then
            echo "Missing repository secret GOOGLE_SERVICES_JSON. See docs/release.md."
            exit 1
          fi
          echo "$GS_JSON" | base64 -d > android/app/google-services.json
          test -s android/app/google-services.json

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Written outside the checkout so no `git add` anywhere can pick it up.
      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          test -s "$RUNNER_TEMP/upload.keystore"

      - name: Build signed AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      # A silently unsigned bundle is the failure mode worth catching here,
      # since Play only tells you about it after a full upload.
      - name: Verify the bundle is signed
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB" || { echo "No AAB produced."; exit 1; }
          if ! unzip -l "$AAB" | grep -qi 'META-INF/.*\.\(RSA\|DSA\|EC\)'; then
            echo "AAB has no signature block — it is UNSIGNED."
            exit 1
          fi
          ls -la "$AAB"

      # Run against the assets unpacked from the AAB itself, not against
      # native/ — this is the artifact that actually reaches Play, and it is the
      # only place a bad `cap sync` would show up. See tools/audit-native.js for
      # what counts as a failure and why.
      - name: Policy audit (unpacked AAB)
        run: |
          mkdir -p "$RUNNER_TEMP/aab-audit"
          unzip -q android/app/build/outputs/bundle/release/app-release.aab -d "$RUNNER_TEMP/aab-audit"
          node tools/audit-native.js "$RUNNER_TEMP/aab-audit/base/assets/public"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ruqyah-pro-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
