name: Build Android APK

# Produces an installable debug APK for on-device testing. The release/signed
# path is a separate workflow (see Phase 4) so this one can stay secret-free.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Capacitor 7 generates capacitor.build.gradle with
      # sourceCompatibility/targetCompatibility = VERSION_21. This job used to
      # install Java 17, which cannot compile that — the mismatch was a standing
      # build failure.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      # --target=native, not the default web target: the web build copies 130 MB
      # of PDFs plus the generated blog into public/, none of which belongs in an
      # APK. build.js fails the build if native/ ever exceeds 20 MB.
      - name: Build Web Assets (native target)
        run: npm run build:native

      # Same audit the release workflow runs. Catching a dropped #web-only
      # marker on an ordinary push is much cheaper than catching it at tag time.
      - name: Policy audit
        run: npm run audit:native

      # Gitignored (it is per-project config, not source), so CI gets it from a
      # secret. Absent, the build still succeeds — Firebase just fails to
      # initialise at runtime and Google sign-in reports that plainly.
      - name: Restore google-services.json
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS_JSON" ]; then
            echo "$GS_JSON" | base64 -d > android/app/google-services.json
            echo "google-services.json restored."
          else
            echo "GOOGLE_SERVICES_JSON not set — Google sign-in will be unavailable in this APK."
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      # Signed with the upload key so every test APK presents the same SHA-1 to
      # Google Sign-In. See android/app/build.gradle for why.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            echo "Signing key restored."
          else
            echo "ANDROID_KEYSTORE_BASE64 not set — falling back to the throwaway debug key."
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ruqyah-pro-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
