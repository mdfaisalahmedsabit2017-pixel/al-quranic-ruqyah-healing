name: Build Android APK

# Produces an installable debug APK for on-device testing. The release/signed
# path is a separate workflow (see Phase 4) so this one can stay secret-free.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Capacitor 7 generates capacitor.build.gradle with
      # sourceCompatibility/targetCompatibility = VERSION_21. This job used to
      # install Java 17, which cannot compile that — the mismatch was a standing
      # build failure.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci

      # --target=native, not the default web target: the web build copies 130 MB
      # of PDFs plus the generated blog into public/, none of which belongs in an
      # APK. build.js fails the build if native/ ever exceeds 20 MB.
      - name: Build Web Assets (native target)
        run: npm run build:native

      # Same audit the release workflow runs. Catching a dropped #web-only
      # marker on an ordinary push is much cheaper than catching it at tag time.
      - name: Policy audit
        run: npm run audit:native

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ruqyah-pro-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
